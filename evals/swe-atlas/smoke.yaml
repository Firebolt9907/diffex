# One SWE-Atlas Codebase QnA trial with the pinned Diffex 0.3.2 adapter.
n_attempts: 1
n_concurrent_trials: 1
retry:
  max_retries: 0
environment:
  type: e2b
  delete: true
  override_cpus: 8
  override_memory_mb: 8192
verifier:
  disable: true
agents:
  - name: diffex_terminal_bench.adapter:DiffexAgent
    model_name: openai/gpt-6-luna
    override_setup_timeout_sec: 630
    kwargs:
      thinking: max
      tools: read,bash,edit,write,update_plan
      subagents: disabled
      project_resources: context-only
      background_process_lifetime: environment
      task_environment: preserve
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
datasets:
  - name: scale-ai/swe-atlas-qna
    ref: "1"
    task_names:
      - scale-ai/task-6905333b74f22949d97ba998
